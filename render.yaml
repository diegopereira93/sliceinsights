services:
  - type: web
    name: sliceinsights-backend
    env: docker
    dockerContext: .
    dockerfilePath: Dockerfile
    plan: free
    branch: main
    autoDeploy: true
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        sync: false # User must provide Neon Connection String
      - key: DATABASE_URL_SYNC
        sync: false # User must provide Neon Connection String (Sync version)
      - key: ALLOWED_ORIGINS
        value: '["https://frontend-five-iota-18.vercel.app", "https://sliceinsights.vercel.app"]' # Frontend URLs
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: "INFO"
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: SEED_FORCE_CLEAR
        value: "false" # Force clear disabled after clean seed

