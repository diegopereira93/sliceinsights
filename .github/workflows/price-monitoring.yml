name: Price Monitoring Pipeline

on:
  schedule:
    # Executar diariamente às 08:00 (Brasília = 11:00 UTC)
    - cron: '0 11 * * *'
  workflow_dispatch:  # Permite execução manual

jobs:
  scrape-and-monitor:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install uv
        run: pip install uv
      
      - name: Install dependencies
        run: |
          uv pip install --system dlt[postgres] pandas playwright psycopg2-binary httpx python-dotenv beautifulsoup4
          python -m playwright install chromium
      
      - name: Run Scraper
        run: python scripts/scrape_brazil_store.py
      
      - name: Run Price Pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/price_pipeline.py
      
      - name: Check for Price Drops
        env:
          DATABASE_URL_SYNC: ${{ secrets.DATABASE_URL_SYNC }}
          PRICE_ALERT_WEBHOOK_URL: ${{ secrets.PRICE_ALERT_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "
          from scripts.price_pipeline import detect_price_drops
          from app.services.price_alerts import get_price_alert_service, PriceAlert
          
          drops = detect_price_drops(threshold_pct=10.0)
          if drops:
              alerts = [PriceAlert(**d) for d in drops]
              service = get_price_alert_service()
              result = service.notify(alerts)
              print(f'📊 {len(alerts)} alertas enviados: {result}')
          else:
              print('✅ Nenhuma queda de preço significativa detectada.')
          "
