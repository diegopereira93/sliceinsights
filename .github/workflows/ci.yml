name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  unit-tests:
    name: Unit Tests & Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Install Playwright browsers
        continue-on-error: true
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Run unit tests
        run: |
          pytest tests/ -v --ignore=tests/test_e2e_api.py
        env:
          # No real DB needed for unit tests (mocked sessions)
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/picklematch
          DATABASE_URL_SYNC: postgresql://postgres:postgres@localhost:5432/picklematch

      - name: Lint with Ruff (fail-warn only)
        continue-on-error: true
        run: |
          ruff check scripts/ app/ tests/

  smoke-tests:
    name: Smoke Tests (Data Quality)
    runs-on: ubuntu-latest
    needs: unit-tests

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: picklematch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Enable pgvector extension
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d picklematch -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Initialize database schema
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          from app.db.database import init_db_sync
          init_db_sync()
          print('Database schema initialized successfully.')
          "
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/picklematch
          DATABASE_URL_SYNC: postgresql://postgres:postgres@localhost:5432/picklematch

      - name: Run smoke tests
        run: |
          python scripts/smoke_test_quality.py
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/picklematch
          DATABASE_URL_SYNC: postgresql://postgres:postgres@localhost:5432/picklematch
