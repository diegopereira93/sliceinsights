name: Catalog Weekly Ingestion

on:
  schedule:
    # Run every Sunday at 00:00 UTC (Saturdays 21:00 Brasilia)
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allow manual trigger from GitHub UI

env:
  DATABASE_URL_SYNC: ${{ secrets.DATABASE_URL_SYNC }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  # JohnKew Excel database encoded as base64.
  JOHNKEW_XLSX_B64: ${{ secrets.JOHNKEW_XLSX_B64 }}

jobs:
  ingest-and-enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium

      # 1. SCRAPING COMERCIAL
      - name: Scrape JustPaddles Paddle Lab
        run: python scripts/scrape_justpaddles.py --limit 100
        continue-on-error: true

      # 2. DATA INGESTION — JohnKew (auto-fetch)
      - name: Fetch JohnKew Database (auto)
        id: fetch_johnkew
        run: |
          python scripts/fetch_johnkew.py --out /tmp/johnkew.csv
          if [[ -f /tmp/johnkew.csv ]]; then
            echo "JOHNKEW_CSV=/tmp/johnkew.csv" >> $GITHUB_ENV
            echo "fetched=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️  JohnKew fetch produced no output file"
            echo "fetched=false" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Ingest JohnKew Data
        if: steps.fetch_johnkew.outputs.fetched == 'true'
        run: python scripts/ingest_johnkew_csv.py --csv "$JOHNKEW_CSV"

      # 3. DATA INGESTION — PB Studio (auto-fetch)
      - name: Fetch PB Studio Database (auto)
        id: fetch_pbstudio
        run: |
          NOTION_ARGS=""
          if [[ -n "${{ secrets.NOTION_TOKEN }}" ]]; then
            NOTION_ARGS="--token ${{ secrets.NOTION_TOKEN }}"
          fi
          python scripts/fetch_pb_studio.py --out /tmp/pbstudio.csv $NOTION_ARGS
          if [[ -f /tmp/pbstudio.csv ]]; then
            echo "PB_STUDIO_CSV=/tmp/pbstudio.csv" >> $GITHUB_ENV
            echo "fetched=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️  PB Studio fetch produced no output file"
            echo "fetched=false" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Ingest PB Studio Data
        if: steps.fetch_pbstudio.outputs.fetched == 'true'
        run: python scripts/ingest_pb_studio_csv.py --csv "$PB_STUDIO_CSV"

      # 4. AUDIT
      - name: Audit and Fix Data Quality
        run: python scripts/audit_data_quality.py --fix
