name: Production Pipeline

on:
  push:
    branches: [ "main", "release/*" ]
  workflow_dispatch: # Allows manual trigger

jobs:
  # ------------------------------------------------------------------
  # 🛡️ QUALITY GATES (CI)
  # ------------------------------------------------------------------
  test-backend:
    name: 🐍 Backend Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: picklematch
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install aiosqlite
      - name: Run Tests
        # Exclude E2E tests in CI as they require a fully seeded database and a running uvicorn instance
        run: PYTHONPATH=. python -m pytest tests/ --ignore=tests/test_e2e_api.py --ignore=tests/test_domain_logic.py
        env:
          DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/picklematch"
          API_SECRET_KEY: "test-secret"

  test-frontend:
    name: ⚛️ Frontend Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Dependencies
        run: npm install
      - name: Build Check
        # Verifies if the project builds successfully (catches TS errors, etc)
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: "https://sliceinsights-4rmf.onrender.com/api/v1"

  # ------------------------------------------------------------------
  # 🚀 DEPLOYMENT (CD)
  # ------------------------------------------------------------------
  deploy-frontend:
    name: 🚀 Deploy Frontend (Vercel)
    needs: [test-frontend] # Only deploy if build passes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Vercel
        working-directory: ./frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_ZFJC51ofDNBpjeDzsdlrte9W
          VERCEL_PROJECT_ID: prj_CCR3NNe9rBgZO8xXFglQN58NP6AZ
        run: |
          npm install --global vercel@latest
          vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  deploy-backend:
    name: 🚀 Deploy Backend (Render)
    needs: [test-backend] # Only deploy if tests pass
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render Deploy Hook
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$DEPLOY_HOOK" ]; then
            echo "Triggering Render Deploy..."
            curl -X POST "$DEPLOY_HOOK"
          else
            echo "⚠️ RENDER_DEPLOY_HOOK secret is missing. Skipping manual trigger."
            echo "Backend will rely on Render's auto-deploy (Git integration)."
          fi

  # ------------------------------------------------------------------
  # 🔄 DATA CONSISTENCY SYNC
  # ------------------------------------------------------------------
  sync-data-quality:
    name: 🔄 Sync Data Quality
    needs: [deploy-backend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Data Quality Audit & Fix
        run: python scripts/audit_data_quality.py --fix
        env:
          DATABASE_URL_SYNC: ${{ secrets.DATABASE_URL_SYNC }}

  # ------------------------------------------------------------------
  # 🕵️‍♀️ VERIFICATION IN PRODUCTION
  verify-deployment:
    name: 🕵️‍♀️ Verify Live Deployment
    needs: [deploy-frontend, sync-data-quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Dependencies
        run: |
          cd frontend
          npm install
      - name: Install Playwright
        run: |
          cd frontend
          npx playwright install --with-deps chromium
      - name: 🏥 Health Check Gate
        run: |
          echo "Checking Backend Health..."
          MAX_RETRIES=24 # 4 minutes
          COUNT=0
          until curl -s https://sliceinsights-4rmf.onrender.com/api/v1/health | grep "healthy"; do
            if [ $COUNT -eq $MAX_RETRIES ]; then
              echo "❌ Backend health check failed after 4 minutes."
              exit 1
            fi
            echo "Waiting for backend (Render Cold Start)... ($COUNT/$MAX_RETRIES)"
            sleep 10
            COUNT=$((COUNT+1))
          done
          echo "✅ Backend is UP and Healthy!"
      - name: 🧪 Run Smoke Tests
        run: |
          cd frontend
          npx playwright test e2e/sliceinsights.spec.ts
        env:
          BASE_URL: "https://sliceinsights.vercel.app"
          API_URL: "https://sliceinsights-4rmf.onrender.com/api/v1"
