services:
  # PostgreSQL Database
  postgres_v3:
    image: postgres:16-alpine
    container_name: picklematch_db_v3
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: picklematch
    ports:
      - "5434:5432"
    volumes:
      - postgres_data_v3:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - picklematch_v3

  # FastAPI Backend
  backend_v3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: picklematch_api_v3
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres_v3:5432/picklematch
      DATABASE_URL_SYNC: postgresql://postgres:postgres@postgres_v3:5432/picklematch
      DEBUG: "true"
    ports:
      - "8002:8000"
    volumes:
      - ./app:/app/app
      - ./tests:/app/tests
      - ./data:/app/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      postgres_v3:
        condition: service_healthy
    networks:
      - picklematch_v3
    restart: unless-stopped

  # Next.js Frontend
  frontend_next:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: builder
    container_name: picklematch_ui_v3
    environment:
      BACKEND_URL: http://backend_v3:8000
      NEXT_PUBLIC_API_URL: http://localhost:8002/api/v1
      NODE_ENV: development
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev
    depends_on:
      - backend_v3
    networks:
      - picklematch_v3
    restart: unless-stopped

  # Streamlit Chat
  chat_v3:
    build:
      context: .
      dockerfile: Dockerfile.chat
    container_name: picklematch_chat_v3
    environment:
      CHAT_DB_HOST: postgres_v3
      CHAT_DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      GROQ_API_KEY: ${GROQ_API_KEY}
    ports:
      - "8502:8501"
    volumes:
      - ./.env:/app/.env
      - ./streamlit/chat:/app/streamlit/chat
    working_dir: /app/streamlit/chat
    depends_on:
      postgres_v3:
        condition: service_healthy
    networks:
      - picklematch_v3
    restart: unless-stopped

  # Seed data runner
  seed_v3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: picklematch_seed_v3
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres_v3:5432/picklematch
      DATABASE_URL_SYNC: postgresql://postgres:postgres@postgres_v3:5432/picklematch
      SEED_FORCE_CLEAR: "true"
    volumes:
      - ./data:/app/data
      - ./app:/app/app
    depends_on:
      postgres_v3:
        condition: service_healthy
    command: python -m app.db.seed_data_hybrid
    networks:
      - picklematch_v3

  # Scraper Service (On-demand)
  scraper:
    build:
      context: .
      dockerfile: Dockerfile.scraper
    container_name: picklematch_scraper
    profiles: ["tools"]
    volumes:
      - ./scripts:/app/scripts
      - ./data:/app/data
    networks:
      - picklematch_v3

volumes:
  postgres_data_v3:

networks:
  picklematch_v3:
    driver: bridge
