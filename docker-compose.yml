services:
  # PostgreSQL Database
  postgres_v3:
    image: pgvector/pgvector:pg16
    container_name: picklematch_db_v3
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: picklematch
    ports:
      - "5434:5432"
    volumes:
      - postgres_data_v3:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - picklematch_v3

  # FastAPI Backend
  backend_v3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: picklematch_api_v3
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres_v3:5432/picklematch
      DATABASE_URL_SYNC: postgresql://postgres:postgres@postgres_v3:5432/picklematch
      DEBUG: "true"
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    ports:
      - "8002:8000"
    volumes:
      - ./app:/app/app
      - ./scripts:/app/scripts
      - ./tests:/app/tests
      - ./data:/app/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      postgres_v3:
        condition: service_healthy
    networks:
      - picklematch_v3
    restart: unless-stopped

  # Vite SPA Frontend
  frontend_vite:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: http://backend_v3:8000
    container_name: picklematch_ui_vite
    ports:
      - "3002:80"
    depends_on:
      - backend_v3
    networks:
      - picklematch_v3
    restart: unless-stopped

  # Seed data runner (on-demand: docker compose run seed_v3)
  seed_v3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: picklematch_seed_v3
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres_v3:5432/picklematch
      DATABASE_URL_SYNC: postgresql://postgres:postgres@postgres_v3:5432/picklematch
      SEED_FORCE_CLEAR: "true"
    volumes:
      - ./data:/app/data
      - ./app:/app/app
      - ./scripts:/app/scripts
    depends_on:
      postgres_v3:
        condition: service_healthy
    entrypoint: ["python", "scripts/seed_from_csv.py"]
    networks:
      - picklematch_v3

volumes:
  postgres_data_v3:

networks:
  picklematch_v3:
    driver: bridge
